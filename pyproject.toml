[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlfluff-plugin-legibility"
version = "0.1.0"
description = "SQLFluff rules for readable, reviewable SQL."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeff Wainwright" }]
keywords = ["sqlfluff", "sql", "lint", "legibility", "readability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["sqlfluff>=4.2.2,<5"]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=7",
  "ruff>=0.12",
  "sqlfluff[testutils]>=4.2.2,<5",
]

[project.urls]
Homepage = "https://github.com/yowainwright/sqlfluff-plugin-legibility"
Issues = "https://github.com/yowainwright/sqlfluff-plugin-legibility/issues"
Repository = "https://github.com/yowainwright/sqlfluff-plugin-legibility"

[project.entry-points.sqlfluff]
sqlfluff_legibility = "sqlfluff_plugin_legibility"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sqlfluff_plugin_legibility = ["plugin_default_config.cfg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["sqlfluff_plugin_legibility"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
